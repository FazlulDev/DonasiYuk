cats:{l:'Kategori',k:'cats',f:[['namaKategori','t'],['deskripsi','a']],c:['namaKategori','deskripsi']},
acts:{l:'Kegiatan',k:'acts',f:[['namaKegiatan','t'],['imageUrl','i'],['tanggal','d'],['lokasi','t'],['deskripsi','a']],c:['namaKegiatan','tanggal','lokasi']},
reps:{l:'Laporan',k:'reps',f:[['programId','p'],['tanggalPenyaluran','d'],['jumlahDana','n'],['deskripsiPenyaluran','a'],['status','s:Tersalurkan,Dalam proses']],c:['programId','tanggalPenyaluran','jumlahDana','status']},
donors:{l:'Donatur',k:'donors',f:[['nama','t'],['email','t'],['nomorWhatsApp','t'],['anonim','b']],c:['nama','email','anonim']},
tx:{l:'Transaksi',k:'tx',f:[['programId','p'],['nominal','n'],['metodePembayaran','s:Transfer bank,E-wallet,QRIS'],['statusPembayaran','s:menunggu pembayaran,berhasil,dibatalkan']],c:['kodeTransaksi','programId','nominal','statusPembayaran']}};
let tab='dash',edit=null;
const authed=()=>sessionStorage.sy_in=='1';
const hash=async x=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sy:'+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'sy:'+x)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}};
V.admin=()=>authed()?panel():loginView();
function loginView(){return`<section><div class="wrap" style="max-width:380px;padding-top:30px"><div class="box"><h2>Login Admin</h2><label for="lu">Username</label><input id="lu" autocomplete="username" value="admin"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><div class="err" id="le"></div><p><button class="btn" onclick="doLogin()">Masuk</button> <a class="btn out" href="#home">Kembali ke situs</a></p><p class="meta">Demo: admin / admin123 (ganti di Pengaturan). Login ini hanya berjalan di browser, bukan keamanan sungguhan.</p></div></div></section>`}
let fails=0,lockUntil=0;
async function doLogin(){if(Date.now()<lockUntil)return $('#le').textContent='Terlalu banyak percobaan. Tunggu 30 detik.';const u=$('#lu').value.trim(),h=await hash($('#lp').value),a=JSON.parse(localStorage.sy_auth||'null')||{u:'admin',h:await hash('admin123')};if(u===a.u&&h===a.h){sessionStorage.sy_in='1';fails=0;go()}else{if(++fails>=5){lockUntil=Date.now()+3e4;fails=0}$('#le').textContent='Username atau password salah.'}}
function logout(){sessionStorage.removeItem('sy_in');location.hash='#home';go()}
async function changePw(){const p=$('#np').value;if(p.length<6)return toast('Password minimal 6 karakter.');localStorage.sy_auth=JSON.stringify({u:'admin',h:await hash(p)});$('#np').value='';toast('Password diganti.')}
const bdc=v=>/berhasil|Tersalurkan|Selesai/.test(v)?'ok':/menunggu|proses/.test(v)?'wa':/batal/.test(v)?'no':'in';
const cell=(k,v)=>/^status/i.test(k)||k=='statusPembayaran'?`<span class="bd b-${bdc(v)}">${esc(v)}</span>`:cell0(k,v);
const ICN={programs:'layers',cats:'tag',acts:'calendar',reps:'file',donors:'users',tx:'swap'};
function panel(){const nav=[['dash','grid','Dashboard']].concat(Object.keys(CFG).map(k=>[k,ICN[k],CFG[k].l]),[['settings','sliders','Pengaturan']]),ttl=tab=='dash'?'Dashboard':tab=='settings'?'Pengaturan':CFG[tab].l;
return`<div class="ad"><aside class="sb"><div class="br">${ic('moon',22)}${esc(S().namaWebsite)}</div>${nav.map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';edit=null;go(true)"><span>${ic(i,18)}</span>${l}</button>`).join('')}</aside><div><div class="tp"><b style="font-family:Fraunces;font-size:20px;color:var(--deep)">${ttl}</b><div style="display:flex;gap:8px;align-items:center"><span class="bd b-in">admin</span><a class="btn out sm" href="#home">${ic('eye',16,'m')}Lihat situs</a><button class="btn sm" onclick="logout()">${ic('logout',16,'m')}Keluar</button></div></div><div class="mn"><div class="warn">Mode demo: data tersimpan di localStorage browser dan bisa diubah siapa saja. Jangan isi data donasi atau data sensitif asli.</div>${tab=='dash'?dash():tab=='settings'?settingsForm():crud()}</div></div></div>`}
function dash(){const ok=db.tx.filter(x=>x.statusPembayaran=='berhasil'),st=['berhasil','menunggu pembayaran','dibatalkan'].map(k=>db.tx.filter(x=>x.statusPembayaran==k).length),tot=Math.max(1,st[0]+st[1]+st[2]),a=st[0]/tot*360,b=a+st[1]/tot*360,top=[...db.programs].sort((x,y)=>pct(y)-pct(x)).slice(0,6),rec=[...db.tx].reverse().slice(0,5);
return`<div class="kpi">${[['Dana terkumpul (simulasi)',rp(sumRaised()),'coins','#1F6FD1'],['Program aktif',db.programs.filter(p=>p.status=='Aktif').length+' dari '+db.programs.length,'layers','#0B2A5B'],['Donasi berhasil',ok.length+' · '+rp(ok.reduce((n,x)=>n+x.nominal,0)),'check','#2f9e6b'],['Donatur',db.donors.length,'users','#C9A24B']].map(([l,v,i,c])=>`<div class="kc"><div class="ic" style="background:${c}">${ic(i,22)}</div><div><b>${v}</b><span>${l}</span></div></div>`).join('')}</div>
<div class="dg"><div class="pn"><h3>Pencapaian program</h3>${top.map(p=>`<div class="hb"><span title="${esc(p.namaProgram)}">${esc(p.namaProgram)}</span><div class="bar"><i style="width:${pct(p)}%"></i></div><b>${pct(p)}%</b></div>`).join('')||'<p>Belum ada program.</p>'}</div><div class="pn"><h3>Status transaksi</h3><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="dn" style="background:conic-gradient(#2f9e6b 0 ${a}deg,#E0A526 ${a}deg ${b}deg,#d9534f ${b}deg 360deg)"></div><div class="meta">Berhasil: ${st[0]}<br>Menunggu: ${st[1]}<br>Dibatalkan: ${st[2]}</div></div></div></div>
<div class="pn"><h3>Transaksi terbaru</h3><div class="tw"><table><tr><th>Kode</th><th>Program</th><th>Nominal</th><th>Status</th></tr>${rec.map(x=>`<tr><td>${esc(x.kodeTransaksi)}</td><td>${esc((prog(x.programId)||{}).namaProgram)}</td><td>${rp(x.nominal)}</td><td>${cell('statusPembayaran',x.statusPembayaran)}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada transaksi.</td></tr>'}</table></div></div>`}
function fl(v){v=v.toLowerCase();document.querySelectorAll('#dt tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(v)?'':'none'})}
const imgField=(k,v)=>`<label>${k} (gambar)</label><input type="file" accept="image/*" onchange="pick(this,'${k}',640)"><input type="hidden" id="a_${k}" value="${esc(v)}"><div><img id="pv_${k}" src="${esc(v)}" alt="" style="max-height:90px;border-radius:8px;margin-top:6px;display:${v?'block':'none'}"> <button type="button" class="btn out sm" onclick="setImg('${k}','')">Hapus gambar</button></div>`;
function setImg(k,d,pre){$('#'+(pre||'a_')+k).value=d;const p=$('#pv_'+k);p.src=d;p.style.display=d?'block':'none'}
function pick(inp,k,w,pre){const f=inp.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('File harus berupa gambar.');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setImg(k,c.toDataURL('image/jpeg',.8),pre)};im.onerror=()=>toast('Gambar tidak bisa dibaca.');im.src=r.result};r.readAsDataURL(f)}
const cell0=(k,v)=>k=='programId'?esc((prog(v)||{namaProgram:'-'}).namaProgram):/nominal|Dana|target|terkumpul/i.test(k)?rp(v):esc(v===true?'ya':v===false?'tidak':v);
function crud(){const c=CFG[tab],rows=db[c.k];return`<div class="pn" style="margin-top:0"><div class="tb"><input placeholder="Cari di tabel…" oninput="fl(this.value)" aria-label="Cari"><button class="btn sm" onclick="edit={};go(true)">${ic('plus',16,'m')}Tambah ${c.l}</button></div>${edit?form(c):''}<div class="tw"><table id="dt"><tr>${c.c.map(k=>`<th>${k}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${c.c.map(k=>`<td>${cell(k,r[k])}</td>`).join('')}<td style="white-space:nowrap"><button class="btn out sm" onclick="edit=db['${c.k}'].find(x=>x.id==${r.id});go(true)">Ubah</button> <button class="btn red sm" onclick="del(${r.id})">Hapus</button></td></tr>`).join('')}</table></div></div>`}
function form(c){const r=edit;return`<div class="box" style="margin-bottom:14px"><h3>${r.id?'Ubah':'Tambah'} ${c.l}</h3>${c.f.map(([k,ty])=>{const v=r[k]??'',id='a_'+k;return ty=='i'?imgField(k,v):ty=='t'?`<label>${k}</label><input id="${id}" value="${esc(v)}">`:ty=='n'?`<label>${k}</label><input id="${id}" type="number" min="0" value="${v}">`:ty=='d'?`<label>${k}</label><input id="${id}" type="date" value="${v}">`:ty=='a'?`<label>${k}</label><textarea id="${id}" rows="2">${esc(v)}</textarea>`:ty=='b'?`<label><input type="checkbox" id="${id}" style="width:auto" ${v?'checked':''}> ${k}</label>`:ty=='c'?`<label>${k}</label><select id="${id}">${db.cats.map(x=>`<option ${v==x.namaKategori?'selected':''}>${esc(x.namaKategori)}</option>`).join('')}</select>`:ty=='p'?`<label>${k}</label><select id="${id}">${db.programs.map(x=>`<option value="${x.id}" ${v==x.id?'selected':''}>${esc(x.namaProgram)}</option>`).join('')}</select>`:`<label>${k}</label><select id="${id}">${ty.slice(2).split(',').map(o=>`<option ${v==o?'selected':''}>${o}</option>`).join('')}</select>`}).join('')}<p><button class="btn" onclick="saveRow()">Simpan</button> <button class="btn out" onclick="edit=null;go(true)">Batal</button></p></div>`}
function saveRow(){const c=CFG[tab],o=edit.id?edit:{id:Math.max(0,...db[c.k].map(x=>x.id))+1};for(const[k,ty]of c.f){const e=$('#a_'+k);o[k]=ty=='b'?e.checked:ty=='n'||ty=='p'?Number(e.value):e.value.trim()}
const nm=o.namaProgram??o.namaKategori??o.namaKegiatan??o.nama;if(nm!==undefined&&!nm)return toast('Nama wajib diisi.');if(tab=='programs'){o.tanggalMulai=o.tanggalMulai||day(0)}if(tab=='tx'){o.kodeTransaksi=o.kodeTransaksi||'SY-DEMO-'+String(o.id).padStart(4,'0');o.tanggalTransaksi=o.tanggalTransaksi||day(0);o.donaturId=o.donaturId||0;o.jenisDonasi=o.jenisDonasi||'Donasi umum'}if(!edit.id)db[c.k].push(o);edit=null;save();toast('Tersimpan.');go(true)}
function del(id){if(!confirm('Hapus data ini?'))return;const k=CFG[tab].k;db[k]=db[k].filter(x=>x.id!=id);save();go(true)}
const SK=['namaWebsite','tagline','deskripsi','heroJudul','heroTeks','nomorWhatsApp','email','alamat','rekeningDonasi','bannerJudul','bannerTeks'];
function settingsForm(){const h=S().heroImage||'';return`<div class="box"><h3>Gambar header</h3><input type="file" accept="image/*" onchange="pick(this,'heroImage',1400,'s_')"><input type="hidden" id="s_heroImage" value="${esc(h)}"><img id="pv_heroImage" src="${esc(h)}" alt="" style="max-width:100%;max-height:140px;border-radius:8px;margin:8px 0;display:${h?'block':'none'}"><button type="button" class="btn out sm" onclick="setImg('heroImage','','s_')">Pakai gambar bawaan</button><h3 style="margin-top:18px">Teks dan kontak</h3>${SK.map(k=>`<label>${k}</label><input id="s_${k}" value="${esc(S()[k])}">`).join('')}<p><button class="btn" onclick="saveSet()">Simpan</button></p></div><div class="box" style="margin-top:14px"><h3>Ganti password</h3><input id="np" type="password" placeholder="Password baru (min. 6)" autocomplete="new-password"><p><button class="btn" onclick="changePw()">Ganti password</button> <button class="btn red" onclick="if(confirm('Reset semua data demo?')){localStorage.removeItem('sy_db');db=seed();save();go(true)}">Reset data demo</button></p></div>`}
function saveSet(){SK.concat('heroImage').forEach(k=>S()[k]=$('#s_'+k).value.trim());if(save())toast('Pengaturan tersimpan.');go(true)}
/* Router */
function go(keep){const h=(location.hash||'#home').slice(1),[n,...r]=h.split('-'),arg=r.join('-'),nav=['home','programs','acts','report','history','about'];
document.body.classList.toggle('adm',n=='admin');$('#menu').classList.remove('open');$('#fab').innerHTML=ic('heart',18,'m')+t('donate');$('#mb').innerHTML=ic('menu',24);$('#top').innerHTML=ic('up',20);$('#fab').style.visibility=n=='donate'?'hidden':'visible';$('#brand').innerHTML=ic('moon',22)+esc(S().namaWebsite);$('#lb').innerHTML=ic('globe',16)+(lang=='id'?'EN':'ID');$('#menu').innerHTML=nav.map(k=>`<a href="#${k}">${ic(NI[k],16)}${t(k)}</a>`).join('')+`<a href="#donate" style="background:var(--gold);color:var(--deep);font-weight:700">${ic('heart',16)}${t('donate')}</a>`;
$('#foot').innerHTML=`<b>${esc(S().namaWebsite)}</b> — ${esc(S().tagline)}<br>${esc(S().alamat)} · ${esc(S().email)} · <a target="_blank" rel="noopener" href="${wa('Halo Sahabat Yatim')}">WhatsApp</a> · <a href="#admin">Login Admin</a><br>Prototype demo tanpa pembayaran sungguhan; tidak mengklaim status lembaga resmi.`;
if(n!='donate'&&n!='programs')draft=draft;$('#app').innerHTML=(V[n]||notFound)(arg);if(n=='programs')list();const hh=$('.hero');if(hh)hh.style.backgroundPosition=S().heroImage?'center':'right bottom';if(hh)hh.style.backgroundImage=`linear-gradient(90deg,#0B2A5Bee 0%,#0B2A5Bcc 45%,#0B2A5B22 100%),url("${S().heroImage||heroImg}")`;if(!keep)scrollTo(0,0)}
addEventListener('hashchange',()=>{navN++;go()});addEventListener('scroll',()=>$('#top').style.display=scrollY>400?'block':'none');go();
</script></body></html>
